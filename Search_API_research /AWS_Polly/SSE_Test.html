<!-- Test Script to check working of SSE -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hello</h1>

    <script>
        const evtSource = new EventSource("http://localhost:3001/audioLink");

        evtSource.addEventListener("audio_synthesis_done", (event) => {
            console.log(`uri: ${(JSON.parse(event.data)).audio_url}`);
            evtSource.close();
        });

        evtSource.addEventListener("audio_synthesis_inProgress", (event) => {
            console.log(`Audio synthesis in Progress`);
        });

        evtSource.addEventListener("error_in_audio_synthesis", (event) => {
            console.log(`Error in audio synthesis received from backend, closing connection`);
            evtSource.close();
        });
    </script>
</body>
</html>
